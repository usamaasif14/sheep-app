name: sheep_manager
description: Farm Manager — manage all your animals in one place.
version: 2.1.0+5
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # Local database
  sqflite: ^2.3.0
  path: ^1.8.3

  # Firebase — optional (only activates when google-services.json is added)
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  google_sign_in: ^6.2.1

  # Charts
  fl_chart: ^0.66.2

  # Image picker
  image_picker: ^1.0.7

  # Notifications
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

  # Export
  excel: ^4.0.6
  share_plus: ^7.2.1
  path_provider: ^2.1.2

  # UI
  flutter_animate: ^4.5.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3
  shared_preferences: ^2.2.2
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
